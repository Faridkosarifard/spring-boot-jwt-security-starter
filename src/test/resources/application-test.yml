spring:
  datasource:
    url: jdbc:h2:mem:jwtstarter;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true

app:
  jwt:
    secret: test-only-jwt-signing-key-not-for-production-use-32b
    issuer: jwt-security-starter-test
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8080
    allow-credentials: true
  security:
    max-failed-logins: 5
    lockout-duration: 15m
    login-rate-limit: 100
    login-rate-window: 15m
    email-verification-ttl: 24h
    password-reset-ttl: 1h
  mail:
    mode: logging
    from: noreply@localhost
    base-url: http://localhost:8080
  admin:
    email: admin@example.com
    username: admin
    password: AdminPassw0rd!
    first-name: Admin
    last-name: User
