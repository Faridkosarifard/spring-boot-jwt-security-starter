services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jwtstarter
      POSTGRES_USER: jwtstarter
      POSTGRES_PASSWORD: jwtstarter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jwtstarter -d jwtstarter"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jwtstarter
      SPRING_DATASOURCE_USERNAME: jwtstarter
      SPRING_DATASOURCE_PASSWORD: jwtstarter
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_ISSUER: jwt-security-starter
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      APP_MAIL_MODE: smtp
      APP_MAIL_FROM: noreply@localhost
      APP_BASE_URL: http://localhost:8080
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_AUTH: "false"
      SPRING_MAIL_STARTTLS: "false"
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}

volumes:
  pgdata:
